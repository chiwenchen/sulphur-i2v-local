name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: |
          # Skip torch / ComfyUI deps (require Apple Silicon-specific wheels,
          # and CI only exercises unit tests against the API + workflow builder
          # with mocked HTTP). Install minimum required for tests.
          uv pip install --system --no-cache \
            fastapi 'uvicorn[standard]' python-multipart pillow \
            httpx pytest 'pytest-asyncio>=0.24'
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short
