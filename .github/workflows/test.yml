name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # The app imports only fastapi + httpx + Pillow at module level (no torch),
        # so CI runs the unit + API tests without the heavyweight ML stack.
        run: |
          python -m pip install --upgrade pip
          pip install \
            'fastapi>=0.115' \
            'uvicorn[standard]>=0.32' \
            'python-multipart>=0.0.12' \
            'pillow>=11' \
            'httpx>=0.27' \
            'pytest>=8.3' \
            'pytest-asyncio>=0.24'
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
