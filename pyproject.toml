[project]
name = "sulphur-i2v-local"
version = "0.1.0"
description = "Local web app for Sulphur-2 Image-to-Video generation on Apple Silicon"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "diffusers>=0.32.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "torch>=2.5.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26.0",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.26,<2.3",
    "sentencepiece>=0.2.0",
    "protobuf>=5.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
